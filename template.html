  [0.5,  '#F0E6D3'],
  [0.65, '#90EE90'],
  [1.0,  '#006400'],
];

function getMidpoints(edges) {
  return edges.slice(0, -1).map((v, i) => +((v + edges[i+1]) / 2).toFixed(3));
}

function buildTrace(tk, overlay) {
  const zd = ZONE_DATA[tk];
  if (!zd) return [];
  const ax = AXIS_MAP[tk] || {};
  const xmc = ax.x || 'X';
  const ymc = ax.y || 'Y';
  const traces = [];

  if (zd.mode === 'comp') {
    const xmids = getMidpoints(zd.x_edges);
    const ymids = getMidpoints(zd.y_edges);
    const zvals = zd.z;
    const nvals = zd.n;

    // hover: ret% + n
    const hoverText = ymids.map((yv, j) =>
      xmids.map((xv, i) => {
        const z = zvals[j][i];
        const n = nvals[j][i];
        return z !== null ? `${xmc}: ${xv}<br>${ymc}_잔차: ${yv}<br>수익: <b>${z}%</b><br>n=${n}` : 'n<5';
      })
    );

    // 이상값 제거 후 절대값 최대로 색상 범위 설정
    const flat = zvals.flat().filter(v => v !== null);
    const mx = Math.max(...flat.map(Math.abs));

    traces.push({
      type: 'heatmap',
      x: xmids.map(v => String(v)),
      y: ymids.map(v => String(v)),
      z: zvals.map(row => row.map(v => v === null ? 0 : v)),
      text: hoverText,
      hoverinfo: 'text',
      colorscale: COLORSCALE,
      zmin: -mx, zmax: mx,
      colorbar: {
        title: { text: '수익률(%)', side: 'right' },
        thickness: 14,
        len: 0.7,
        tickfont: { size: 11, color: '#8b949e' },
        titlefont: { size: 11, color: '#8b949e' },
      },
      name: tk,
    });

    // ⭐ 현재좌표
    if (overlay && overlay.current && overlay.current[tk]) {
      const cur = overlay.current[tk];
      const cx = cur.x;
      // Y = 잔차 계산 (slope/intercept/residual_std)
      let cy = cur.y;
      if (zd.slope !== undefined && zd.residual_std) {
        const raw_y = cur.y;
        const residual = raw_y - (zd.slope * cx + zd.intercept);
        cy = residual / zd.residual_std;
      }
      traces.push({
        type: 'scatter',
        x: [String(+cx.toFixed(3))],
        y: [String(+cy.toFixed(3))],
        mode: 'markers+text',
        marker: { symbol: 'star', size: 20, color: '#FFD700', line: { color: '#fff', width: 1.5 } },
        text: ['⭐'],
        textposition: 'top center',
        textfont: { size: 14 },
        hoverinfo: 'text',
        hovertext: [`⭐ 현재 (as_of: ${overlay.as_of})<br>${xmc}: ${cx.toFixed(3)}<br>${ymc}_잔차: ${cy.toFixed(3)}`],
        name: '현재좌표',
        showlegend: false,
      });

      // 10일 궤적
      if (overlay.trajectory && overlay.trajectory[tk] && overlay.trajectory[tk].length > 1) {
        const traj = overlay.trajectory[tk];
        const txs = [], tys = [], tds = [];
        for (const pt of traj) {
          if (pt.x !== undefined && pt.y !== undefined) {
            const tr_residual = pt.y - (zd.slope * pt.x + zd.intercept);
            const tr_y = tr_residual / zd.residual_std;
            txs.push(String(+pt.x.toFixed(3)));
            tys.push(String(+tr_y.toFixed(3)));
            tds.push(pt.d || '');
          }
        }
        if (txs.length > 1) {
          traces.push({
            type: 'scatter',
            x: txs, y: tys,
            mode: 'lines+markers',
            line: { color: 'rgba(255,215,0,0.5)', width: 1.5, dash: 'dot' },
            marker: { size: 5, color: 'rgba(255,215,0,0.7)' },
            hovertext: tds.map((d, i) => `${d}<br>${xmc}: ${txs[i]}<br>${ymc}_잔차: ${tys[i]}`),
            hoverinfo: 'text',
            name: '궤적(10일)',
            showlegend: false,
          });
        }
      }
    }

  } else {
    // single axis — 1D bar
    const xmids = getMidpoints(zd.x_edges);
    const vals = zd.z.map(v => v === null ? 0 : v);
    traces.push({
      type: 'bar',
      x: xmids.map(v => String(v)),
      y: vals,
      marker: { color: vals.map(v => v >= 0 ? '#006400' : '#8B0000') },
      hovertext: xmids.map((xv, i) => `${xmc}: ${xv}<br>수익: <b>${zd.z[i]}%</b><br>n=${zd.n[i]}`),
      hoverinfo: 'text',
      name: tk,
    });

    if (overlay && overlay.current && overlay.current[tk]) {
      const cur = overlay.current[tk];
      traces.push({
        type: 'scatter',
        x: [String(+cur.x.toFixed(3))],
        y: [0],
        mode: 'markers',
        marker: { symbol: 'star', size: 20, color: '#FFD700', line: { color: '#fff', width: 1.5 } },
        hovertext: [`⭐ 현재 ${xmc}: ${cur.x.toFixed(3)}`],
        hoverinfo: 'text',
        name: '현재좌표',
        showlegend: false,
      });
    }
  }
  return traces;
}

function renderChart(idx, overlay) {
  const tk = TICKERS[idx];
  const zd = ZONE_DATA[tk];
  const ax = AXIS_MAP[tk] || {};
  const xmc = ax.x || 'X';
  const ymc = ax.y || 'Y';
  const icX = ax.ic_x !== undefined ? ax.ic_x.toFixed(3) : '?';
  const icY = ax.ic_y !== undefined ? ax.ic_y.toFixed(3) : '?';
  const mode = zd ? zd.mode : '';

  const traces = buildTrace(tk, overlay);
  const yLabel = mode === 'comp' ? `${ymc}_잔차 (X 직교화)` : '';
  const xLabel = xmc + ` (IC=${icX})`;

  const layout = {
    paper_bgcolor: '#0d1117',
    plot_bgcolor: '#161b22',
    font: { color: '#e6edf3', size: 12 },
    title: {
      text: `<b>${tk}</b>  ·  forward 60일 수익률 중앙값(%)  ·  X: ${xmc}(IC=${icX})` + (mode==='comp' ? `  ·  Y: ${ymc}잔차(IC=${icY})` : ''),
      font: { size: 15, color: '#58a6ff' },
      x: 0.5,
    },
    xaxis: { title: xLabel, gridcolor: '#30363d', color: '#8b949e', tickfont: { size: 11 } },
    yaxis: { title: yLabel, gridcolor: '#30363d', color: '#8b949e', tickfont: { size: 11 } },
    margin: { t: 60, b: 55, l: 65, r: 80 },
    dragmode: 'pan',
    hovermode: 'closest',
  };

  Plotly.react('plotly-chart', traces, layout, { responsive: true, displayModeBar: false });

  // 현재좌표 정보 표시
  const infoEl = document.getElementById('current-info');
  if (overlay && overlay.current && overlay.current[tk]) {
    const cur = overlay.current[tk];
    infoEl.textContent = `⭐ ${xmc}: ${cur.x.toFixed(2)}  ${overlay.as_of}`;
    infoEl.style.display = 'block';
  } else {
    infoEl.style.display = 'none';
  }

  // nav 버튼 active 업데이트
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
    if (i === idx) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });

  // 인덱스 표시
  document.getElementById('asof-label').textContent =
    `${idx + 1}/${TICKERS.length}  · as_of: ${(overlay && overlay.as_of) || '—'}`;
}

function navigate(dir) {
  currentIdx = (currentIdx + dir + TICKERS.length) % TICKERS.length;
  renderChart(currentIdx, window._OVERLAY || null);
}

function jumpTo(idx) {
  currentIdx = idx;
  renderChart(currentIdx, window._OVERLAY || null);
}

// nav 버튼 생성
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TICKERS.forEach((tk, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = tk;
    btn.onclick = () => jumpTo(i);
    nav.appendChild(btn);
  });
}

// 키보드 / 스와이프
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
});
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
}, { passive: true });

// ── 초기화 ──────────────────────────────────────────────
buildNav();

// live overlay 주입 (gen_macro_zone_chart.py가 /**DATA**/ 치환)
if (typeof OVERLAY !== 'undefined') {
  window._OVERLAY = OVERLAY;
  document.getElementById('asof-label').textContent = 'as_of: ' + (OVERLAY.as_of || '—');
}

renderChart(0, window._OVERLAY || null);
</script>
</body>
</html>
