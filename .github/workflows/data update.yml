# ════════════════════════════════════════════════════════════════════
# 🦅 ARGUS Data Update — 최신 원격 기준 재생성·게시 검증
# ════════════════════════════════════════════════════════════════════
# 저장소: argus-public-data (PUBLIC)
#
# 핵심 계약
#   NORMAL
#     ① argus_data_fetcher.py 실행
#     ② 마지막 완결 XNYS 세션 == argus_data.csv 말미를 강제 검증
#     ③ latest.json 생성
#     ④ PENDING_GENERATION.json 부재를 확인한 뒤 데이터만 commit
#
#   PREPARE_AND_MIGRATE (수동 1회 전용)
#     A. make_migration_bundle.py — network 허용, 의존성 동결
#     B/C/D. CALENDAR_MIGRATION_MODE=1 — network hard-off
#     E. generation / CURRENT / baseline / public regular-file SHA 검증
#     F. migration 증거를 PUBLIC repo에 commit
#     ※ migration run에서는 정상 daily fetch를 이어서 실행하지 않는다.
#        Crown BEFORE/AFTER 순수성을 보존한 뒤 NORMAL 수동 실행으로 최신 세션을 붙인다.
#
# P0 방어
#   - fetcher가 migration_required에서 exit 0으로 반환해도 session freshness gate가 차단한다.
#   - stale CSV는 latest.json/commit으로 정상 승격되지 않는다.
#   - PENDING_GENERATION.json이 남아 있으면 어떤 commit도 금지한다.
#   - migration_baseline_frozen.csv / migration_generations / CURRENT_GENERATION.json을 영속화한다.
# ════════════════════════════════════════════════════════════════════

name: 🦅 ARGUS Data Update

on:
  # 수집 코드 업로드 후 실제 자료도 갱신한다. 산출물 커밋은 재실행하지 않는다.
  push:
    branches: ['main']
    paths:
      - 'argus_data_fetcher.py'
      - 'requirements.txt'
      - 'make_latest_json.py'
      - 'make_migration_bundle.py'
      - '.github/workflows/data update.yml'
  schedule:
    - cron: '17 22 * * 1-5'   # primary: 미국장 마감 후
    - cron: '17 23 * * 1-5'   # retry
  workflow_dispatch:
    inputs:
      calendar_migration:
        description: '캘린더 마이그레이션 모드'
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'prepare_and_migrate'
      backfill_force:
        description: '백필 강제 (cover<50% 컬럼 전체 재백필)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      backfill_start:
        description: '소급 백필 시작일 YYYY-MM-DD (end와 함께 지정)'
        required: false
        default: ''
        type: string
      backfill_end:
        description: '소급 백필 종료일 YYYY-MM-DD (start와 함께 지정)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: argus-data-update
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout argus-public-data
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # 동시 실행 그룹은 유지한다. 다른 게시 경로와의 충돌도 아래 재생성 절차로 감지한다.
      - name: 🔄 최신 원격 기준 생성·검증·게시
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ARGUS_REF: ${{ github.ref }}
          ARGUS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARGUS_EVENT: ${{ github.event_name }}
          ARGUS_MIGRATION: ${{ github.event.inputs.calendar_migration || 'off' }}
          BACKFILL_FORCE: ${{ github.event.inputs.backfill_force || 'false' }}
          BACKFILL_START: ${{ github.event.inputs.backfill_start || '' }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end || '' }}
        shell: python
        run: |
          # 원본 검증 규칙을 유지하며 게시 경합 시 최신 원격 상태에서 재생성한다.
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          
          INSTALL = r"""
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import importlib.metadata as md
          import exchange_calendars as xcals
          v = md.version("exchange-calendars")
          print("exchange-calendars =", v)
          if v != "4.13.2":
              raise SystemExit(f"exchange-calendars pin mismatch: {v} != 4.13.2")
          print("XNYS =", xcals.get_calendar("XNYS").name)
          PY
          """
          
          MIGRATION_VALIDATE = r"""
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          
          root = Path(".")
          pending = root / "PENDING_GENERATION.json"
          if pending.exists():
              raise SystemExit("PENDING_GENERATION.json 잔존 — commit 금지")
          
          current_path = root / "CURRENT_GENERATION.json"
          baseline = root / "migration_baseline_frozen.csv"
          report = root / "calendar_integrity_report.json"
          
          for p in (current_path, baseline, report):
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"migration artifact 비정상: {p}")
          
          cur = json.loads(current_path.read_text(encoding="utf-8"))
          if cur.get("state") != "committed":
              raise SystemExit(f"CURRENT state 비정상: {cur.get('state')!r}")
          
          gen_rel = cur.get("generation_relpath")
          hashes = cur.get("files_sha256") or {}
          if not gen_rel or not hashes:
              raise SystemExit("CURRENT_GENERATION.json 불완전")
          
          gen = root / gen_rel
          if not gen.is_dir():
              raise SystemExit(f"generation dir 없음: {gen}")
          
          required = (
              "argus_data.csv",
              "argus_data_daily.csv",
              "argus_data_weekly.csv",
              "argus_data_monthly.csv",
              "migration_baseline_frozen.csv",
              "calendar_integrity_report.json",
          )
          
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          
          for name in required:
              want = hashes.get(name)
              if not want:
                  raise SystemExit(f"CURRENT hash 누락: {name}")
          
              gp = gen / name
              pp = root / name
              for label, p in (("generation", gp), ("public", pp)):
                  if not p.is_file() or p.is_symlink():
                      raise SystemExit(f"{label} regular-file 위반: {p}")
                  got = sha(p)
                  if got != want:
                      raise SystemExit(
                          f"{label} SHA 불일치 {name}: {got[:12]} != {want[:12]}"
                      )
          
          print("✅ migration generation/public SHA 전수 일치")
          print("generation_id =", cur["generation_id"])
          print("baseline_sha  =", sha(baseline))
          print("after_sha     =", sha(gen / "argus_data.csv"))
          PY
          """
          
          FRESHNESS = r"""
          python - <<'PY'
          import json
          from pathlib import Path
          
          import pandas as pd
          import exchange_calendars as xcals
          
          now = pd.Timestamp.now(tz="UTC")
          cal = xcals.get_calendar("XNYS")
          
          # 충분한 과거 구간에서 마지막 session close <= now를 고른다.
          start = (now - pd.Timedelta(days=14)).date()
          end = (now + pd.Timedelta(days=1)).date()
          sessions = cal.sessions_in_range(start, end)
          
          completed = []
          for s in sessions:
              close = cal.session_close(s)
              if close <= now:
                  completed.append((s, close))
          
          if not completed:
              raise SystemExit("XNYS completed session 계산 실패")
          
          expected_session, expected_close = completed[-1]
          expected = pd.Timestamp(expected_session).date()
          
          df = pd.read_csv("argus_data.csv", usecols=["Date"])
          if df.empty:
              raise SystemExit("argus_data.csv 데이터 0행")
          dates = pd.to_datetime(df["Date"], errors="coerce")
          if dates.isna().any():
              raise SystemExit("argus_data.csv Date 파싱 실패")
          data_last = dates.max().date()
          
          print("UTC now       :", now.isoformat())
          print("XNYS expected :", expected, "(close", expected_close.isoformat() + ")")
          print("CSV data_last :", data_last)
          
          if data_last != expected:
              mode = None
              rp = Path("calendar_integrity_report.json")
              if rp.is_file():
                  try:
                      mode = json.loads(rp.read_text(encoding="utf-8")).get("mode")
                  except Exception:
                      pass
          
              if mode == "migration_required":
                  raise SystemExit(
                      "DATA STALE + CALENDAR MIGRATION REQUIRED — "
                      f"csv={data_last} expected={expected}. "
                      "Actions > ARGUS Data Update > Run workflow > "
                      "calendar_migration=prepare_and_migrate 를 1회 실행할 것."
                  )
          
              raise SystemExit(
                  "DATA STALE — 마지막 완결 XNYS 세션과 불일치: "
                  f"csv={data_last} expected={expected}"
              )
          
          print("✅ SESSION FRESHNESS PASS")
          PY
          """
          
          GENERATION_SAFETY = r"""
          test ! -e PENDING_GENERATION.json || {
            echo "::error::PENDING_GENERATION.json 잔존 — mixed generation commit 금지"
            exit 1
          }
          
          for f in argus_data.csv argus_data_daily.csv argus_data_weekly.csv argus_data_monthly.csv; do
            test -f "$f" || { echo "::error::$f 부재"; exit 1; }
            test ! -L "$f" || { echo "::error::$f symlink 금지"; exit 1; }
          done
          echo "✅ public data files = regular files"
          """
          
          DATA_FILES = [
              'argus_data.csv', 'argus_data_daily.csv', 'argus_data_weekly.csv',
              'argus_data_monthly.csv', 'latest.json', 'calendar_integrity_report.json',
              'CURRENT_GENERATION.json',
          ]
          WORKFLOW_PATH = '.github/workflows/data update.yml'
          
          
          def command(args, cwd, *, env=None, capture=False, check=True):
              return subprocess.run(args, cwd=cwd, env=env, check=check, text=True,
                                    stdout=subprocess.PIPE if capture else None)
          
          
          def git(cwd, *args, check=True):
              return command(['git', *args], cwd, capture=True, check=check).stdout.strip()
          
          
          def refresh(repo):
              git(repo, 'fetch', '--no-tags', 'origin',
                  '+refs/heads/main:refs/remotes/origin/main')
              return git(repo, 'rev-parse', 'refs/remotes/origin/main')
          
          
          def shell(script, cwd, env):
              command(['bash', '-euo', 'pipefail', '-c', script], cwd, env=env)
          
          
          def pending_check(work):
              pending = work / 'PENDING_GENERATION.json'
              if pending.exists() or pending.is_symlink():
                  raise RuntimeError('PENDING_GENERATION.json 잔존 — 게시 금지')
          
          
          def validate_inputs(env):
              if env.get('ARGUS_REF') != 'refs/heads/main':
                  raise RuntimeError('main 브랜치에서만 데이터 게시를 허용합니다.')
              mode = env.get('ARGUS_MIGRATION', 'off')
              if env.get('ARGUS_EVENT') != 'workflow_dispatch':
                  mode = 'off'
              if mode not in ('off', 'prepare_and_migrate'):
                  raise RuntimeError('지원하지 않는 마이그레이션 모드')
              start, end = env.get('BACKFILL_START', ''), env.get('BACKFILL_END', '')
              if bool(start) != bool(end):
                  raise RuntimeError('백필 시작일과 종료일은 함께 지정해야 합니다.')
              if start:
                  first, last = dt.date.fromisoformat(start), dt.date.fromisoformat(end)
                  if first.isoformat() != start or last.isoformat() != end or first > last:
                      raise RuntimeError('백필 날짜 형식 또는 순서가 잘못되었습니다.')
              if env.get('BACKFILL_FORCE', 'false') not in ('true', 'false'):
                  raise RuntimeError('BACKFILL_FORCE 값 오류')
              if mode != 'off' and (start or env.get('BACKFILL_FORCE') == 'true'):
                  raise RuntimeError('마이그레이션과 백필은 분리 실행해야 합니다.')
              return mode
          
          
          def generate(work, env, mode):
              # 원격 기준이 바뀌면 의존성도 새 requirements.txt 기준으로 설치한다.
              pending_check(work)
              shell(INSTALL, work, env)
              run_env = dict(env, BACKFILL_DATE='')
              run_env.pop('CALENDAR_MIGRATION_MODE', None)
              if mode == 'prepare_and_migrate':
                  command([sys.executable, 'make_migration_bundle.py',
                           '--fetcher', 'argus_data_fetcher.py'], work, env=run_env)
                  run_env['CALENDAR_MIGRATION_MODE'] = '1'
                  command([sys.executable, 'argus_data_fetcher.py'], work, env=run_env)
                  shell(MIGRATION_VALIDATE, work, run_env)
              else:
                  command([sys.executable, 'argus_data_fetcher.py'], work, env=run_env)
                  if env.get('BACKFILL_START') and env.get('BACKFILL_END'):
                      current_env = dict(run_env, BACKFILL_FORCE='false',
                                         BACKFILL_START='', BACKFILL_END='', BACKFILL_DATE='')
                      command([sys.executable, 'argus_data_fetcher.py'], work, env=current_env)
                  shell(FRESHNESS, work, run_env)
                  shell(GENERATION_SAFETY, work, run_env)
              command([sys.executable, 'make_latest_json.py'], work, env=run_env)
              pending_check(work)
              if mode == 'prepare_and_migrate':
                  # latest.json 생성 이후에도 동결된 증거 파일의 무결성을 확인한다.
                  shell(MIGRATION_VALIDATE, work, run_env)
              else:
                  shell('''python - <<'CHECK'
          import json
          import pandas as pd
          last = str(pd.to_datetime(pd.read_csv('argus_data.csv')['Date']).max().date())
          latest = json.load(open('latest.json', encoding='utf-8'))
          if latest.get('Date') != last:
              raise SystemExit(f"latest.json Date 불일치: {latest.get('Date')} != {last}")
          print('✅ latest.json / CSV Date 일치:', last)
          CHECK
          ''', work, run_env)
          
          
          def publish(repo, env, mode, generate_fn=generate, max_attempts=3):
              git(repo, 'config', 'user.name', 'argus-bot')
              git(repo, 'config', 'user.email', 'argus-bot@users.noreply.github.com')
              workflow_source = env.get('ARGUS_WORKFLOW_SHA') or 'HEAD'
              workflow_blob = git(repo, 'rev-parse', f'{workflow_source}:{WORKFLOW_PATH}')
              attempts = 1 if mode == 'prepare_and_migrate' else max_attempts
              for attempt in range(1, attempts + 1):
                  base = refresh(repo)
                  if git(repo, 'rev-parse', f'{base}:{WORKFLOW_PATH}') != workflow_blob:
                      raise RuntimeError('실행 중 workflow 변경 감지 — 최신 workflow로 새 실행 필요')
                  # 사용자 작업 공간을 초기화하지 않고 실행마다 독립된 작업 사본을 만든다.
                  folder = Path(tempfile.mkdtemp(prefix='argus-publish-', dir=env.get('RUNNER_TEMP')))
                  work = folder / 'work'
                  git(repo, 'worktree', 'add', '--detach', str(work), base)
                  print(f'::group::데이터 생성·검증 {attempt}/{attempts} — 기준 {base}', flush=True)
                  try:
                      generate_fn(work, env, mode)
                      pending_check(work)
                      required = DATA_FILES[:5]
                      optional = DATA_FILES[5:]
                      if mode == 'prepare_and_migrate':
                          required = DATA_FILES + ['migration_baseline_frozen.csv',
                                                   'migration_generations', 'migration_inputs']
                          optional = []
                      else:
                          required = required + ['wsts_yoy.json']
                      for name in required:
                          p = work / name
                          if not p.exists() or p.is_symlink():
                              raise RuntimeError(f'게시 필수 산출물 부재 또는 symlink: {name}')
                      files = required + [name for name in optional if (work / name).exists()]
                      for name in files:
                          if (work / name).is_symlink():
                              raise RuntimeError(f'게시 산출물 symlink 금지: {name}')
                      git(work, 'add', '--', *files)
                      changed = command(['git', 'diff', '--staged', '--quiet'], work,
                                        check=False).returncode
                      if changed not in (0, 1):
                          raise RuntimeError('staged 변경 검사 실패')
                      if not changed and mode != 'off':
                          raise RuntimeError('마이그레이션 실행 후 변경 없음 — 비정상')
                      data_date = json.loads((work / 'latest.json').read_text())['Date']
                      if changed:
                          if mode == 'off':
                              message = f'📡 data: {data_date} session update [skip ci]'
                          else:
                              generation = json.loads((work / 'CURRENT_GENERATION.json').read_text())
                              message = f"🧭 calendar migration {generation['generation_id']}"
                          git(work, 'commit', '-m', message)
                      target = git(work, 'rev-parse', 'HEAD')
                      remote = refresh(repo)
                      if remote != base:
                          if mode != 'off':
                              raise RuntimeError('마이그레이션 중 원격 변경 — 증거 재적용/자동 반복 금지')
                          print('원격 변경 감지 — 최신 상태에서 전체 재생성', flush=True)
                          continue
                      if changed:
                          # 일반 push의 원격 참조 검사를 이용하며 강제 push와 rebase는 사용하지 않는다.
                          pushed = command(['git', 'push', 'origin', 'HEAD:refs/heads/main'],
                                           work, check=False)
                          remote = refresh(repo)
                          if pushed.returncode != 0 and remote == base:
                              raise RuntimeError('원격 변경 없는 push 실패 — 인증·권한·네트워크 확인 필요')
                      # 게시 직후 원격이 추가로 바뀌어도 우리의 변경이 이력에 남아 있는지 확인한다.
                      contained = command(['git', 'merge-base', '--is-ancestor', target, remote],
                                          repo, check=False).returncode == 0
                      identical = contained and all(
                          git(repo, 'ls-tree', target, '--', name) ==
                          git(repo, 'ls-tree', remote, '--', name) for name in files)
                      remote_pending = bool(git(repo, 'ls-tree', remote, '--', 'PENDING_GENERATION.json'))
                      if identical and not remote_pending:
                          print(f'✅ REMOTE DATA VERIFY PASS: {remote} / Date={data_date}', flush=True)
                          if mode != 'off':
                              print('마이그레이션 종료. Crown BEFORE/AFTER 검증 후 NORMAL 별도 실행.', flush=True)
                          return {'result': 'REMOTE DATA VERIFY PASS', 'attempt': attempt,
                                  'data_date': data_date, 'base': base, 'commit': target,
                                  'verified_remote': remote, 'changed': bool(changed), 'mode': mode}
                      if mode != 'off':
                          raise RuntimeError('마이그레이션 게시 후 원격 변경 감지 — 증거 수동 점검 필요')
                      print('게시 경합 감지 — 최신 원격 상태에서 전체 재생성', flush=True)
                  finally:
                      print('::endgroup::', flush=True)
              raise RuntimeError(f'원격 변경 경합이 {attempts}회 지속되어 게시 검증 실패')
          
          
          def main():
              env = dict(os.environ)
              result = {'result': 'FAILED', 'event': env.get('ARGUS_EVENT'),
                        'event_sha': env.get('GITHUB_SHA'), 'run_id': env.get('GITHUB_RUN_ID')}
              try:
                  mode = validate_inputs(env)
                  result.update(publish(Path.cwd(), env, mode))
              except Exception as exc:
                  result['error'] = str(exc)
                  print(f'::error::{exc}', flush=True)
                  raise
              finally:
                  # 실행 요약은 실패한 작업 파일을 재파싱하지 않는다.
                  summary = env.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as f:
                          f.write('## 🦅 ARGUS Data Update 결과\n\n')
                          for key, value in result.items():
                              f.write(f'- {key}: `{value}`\n')
                          f.write('\n원격 데이터 검증 결과이며 브리핑 HTML 게시 검증과는 별개입니다.\n')
          
          
          if __name__ == '__main__':
              main()
