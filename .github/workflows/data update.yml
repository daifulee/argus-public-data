# ════════════════════════════════════════════════════════════════════
# 🦅 ARGUS Data Update — 최신 원격 기준 재생성·게시 검증
# ════════════════════════════════════════════════════════════════════
# 저장소: argus-public-data (PUBLIC)
#
# 핵심 계약
#   NORMAL
#     ① argus_data_fetcher.py 실행
#     ② 마지막 완결 XNYS 세션 == argus_data.csv 말미를 강제 검증
#     ③ latest.json 생성
#     ④ PENDING_GENERATION.json 부재를 확인한 뒤 데이터만 commit
#
#   PREPARE_AND_MIGRATE (수동 1회 전용)
#     A. make_migration_bundle.py — network 허용, 의존성 동결
#     B/C/D. CALENDAR_MIGRATION_MODE=1 — network hard-off
#     E. generation / CURRENT / baseline / public regular-file SHA 검증
#     F. migration 증거를 PUBLIC repo에 commit
#     ※ migration run에서는 정상 daily fetch를 이어서 실행하지 않는다.
#        Crown BEFORE/AFTER 순수성을 보존한 뒤 NORMAL 수동 실행으로 최신 세션을 붙인다.
#
# P0 방어
#   - fetcher가 migration_required에서 exit 0으로 반환해도 session freshness gate가 차단한다.
#   - stale CSV는 latest.json/commit으로 정상 승격되지 않는다.
#   - PENDING_GENERATION.json이 남아 있으면 어떤 commit도 금지한다.
#   - migration_baseline_frozen.csv / migration_generations / CURRENT_GENERATION.json을 영속화한다.
# ════════════════════════════════════════════════════════════════════

name: 🦅 ARGUS Data Update
run-name: ARGUS Data ${{ inputs.pipeline_request_id || github.run_id }}

on:
  # 수집 코드 업로드 후 실제 자료도 갱신한다. 산출물 커밋은 재실행하지 않는다.
  push:
    branches: ['main']
    paths:
      - 'argus_data_fetcher.py'
      - 'argus_pipeline_contract.py'
      - 'argus_data_publish.py'
      - 'requirements.txt'
      - 'make_latest_json.py'
      - 'make_migration_bundle.py'
      - '.github/workflows/data update.yml'
  schedule:
    - cron: '17 22 * * 1-5'   # primary: 미국장 마감 후
    - cron: '17 23 * * 1-5'   # retry
  workflow_dispatch:
    inputs:
      pipeline_request_id:
        description: '복구기가 발급한 실행 식별자 (직접 실행 시 비워 둠)'
        required: false
        default: ''
        type: string
      calendar_migration:
        description: '캘린더 마이그레이션 모드'
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'prepare_and_migrate'
      backfill_force:
        description: '백필 강제 (cover<50% 컬럼 전체 재백필)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      backfill_start:
        description: '소급 백필 시작일 YYYY-MM-DD (end와 함께 지정)'
        required: false
        default: ''
        type: string
      backfill_end:
        description: '소급 백필 종료일 YYYY-MM-DD (start와 함께 지정)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: argus-data-update
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout argus-public-data
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # 동시 실행 그룹은 유지한다. 다른 게시 경로와의 충돌도 아래 재생성 절차로 감지한다.
      - name: 🔄 최신 원격 기준 생성·검증·게시
        id: publish_data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ARGUS_REF: ${{ github.ref }}
          ARGUS_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ARGUS_EVENT: ${{ github.event_name }}
          ARGUS_MIGRATION: ${{ github.event.inputs.calendar_migration || 'off' }}
          PIPELINE_REQUEST_ID: ${{ inputs.pipeline_request_id }}
          BACKFILL_FORCE: ${{ github.event.inputs.backfill_force || 'false' }}
          BACKFILL_START: ${{ github.event.inputs.backfill_start || '' }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end || '' }}
        working-directory: ${{ github.workspace }}
        run: python argus_data_publish.py

      - name: 🧾 시작 실패를 포함한 진단 파일 확인
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish_data.outcome }}
        working-directory: ${{ github.workspace }}
        shell: python
        run: |
          # 저장소 모듈에 의존하지 않아 import 실패도 기록한다.
          import json
          import os
          from pathlib import Path
          path = Path('argus_pipeline_result.json')
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          try:
              result = json.loads(path.read_text(encoding='utf-8'))
              valid = (str(result.get('run_id')) == run_id and
                       result.get('run_attempt') == attempt)
          except (OSError, ValueError, AttributeError):
              valid = False
          if not valid:
              result = {'run_id': run_id, 'run_attempt': attempt,
                        'status': 'BOOTSTRAP_OR_DIAGNOSTIC_FAILURE', 'retryable': False,
                        'reason': '수집·게시 진입점의 이번 실행 진단 없음; publish outcome=' + os.getenv('PUBLISH_OUTCOME', 'unknown') + '; 해당 단계의 최초 오류 로그 확인 필요'}
              path.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
              print('::error::' + result['reason'])
              raise SystemExit(1)

      - name: 📎 수집·게시 실행 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-pipeline-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus_pipeline_result.json
          if-no-files-found: warn
          retention-days: 30
