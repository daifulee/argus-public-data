# =====================================================================
# ARGUS — FRED Broad 거시지표 일일 수집 워크플로
# 배치 위치: .github/workflows/fred_broad.yml (자기레포 루트의 fred_broad_gha.py 실행)
# 핵심: permissions.contents=write → GITHUB_TOKEN으로 자기레포 커밋
#       (폐기된 PAT v4.0 HTTP 403 우회 — 별도 토큰 불요)
# 사전 등록: Settings > Secrets and variables > Actions > New repository secret
#            이름 FRED_API_KEY / 값 = FRED 무료 API 키(32자)
# 수동 실행: Actions 탭 > 본 워크플로 > Run workflow (workflow_dispatch)
# =====================================================================
name: ARGUS FRED Broad Daily

on:
  schedule:
    # 평일 23:30 UTC (= 미 동부 18:30, 장 마감 후 → 당일 일간 시리즈 반영)
    # 주의: GitHub Actions cron은 UTC 기준이며 ±수분 지연 가능.
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

# 자기레포 커밋 권한 (PAT 불요)
permissions:
  contents: write

# 직전 실행이 진행 중이면 취소하고 최신만 유지
concurrency:
  group: fred-broad-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fredapi pandas numpy

      - name: Collect FRED broad series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fred_broad_gha.py

      - name: Commit & push if changed
        run: |
          git config user.name  "argus-bot"
          git config user.email "argus-bot@users.noreply.github.com"
          git add argus_fred_broad.csv argus_fred_meta.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): FRED broad daily $(date -u +%Y-%m-%d) [skip ci]"
            git push
            echo "커밋·푸시 완료"
          fi
