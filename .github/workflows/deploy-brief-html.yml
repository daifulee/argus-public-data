      - name: 📊 Falsification scoreboard (D-3)
        id: scoreboard_causal
        continue-on-error: true
        env:
          LOCAL_DATA_CSV: argus_data_combined.csv
          PRIMA_DAILY_CSV: ./prima_daily_output_causal.csv   # PRIMA leg = 일일 로거 산출(동일 run)
        run: |
