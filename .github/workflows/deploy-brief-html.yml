              "https://raw.githubusercontent.com/daifulee/argus-public-data/main/${_f}" \
              -o "${_f}" && echo "seed ${_f} fetch ✅" || echo "seed ${_f} 없음 (신규 시작)"
          done
          rm -f maq_latest_causal.json
          python maq_monitor.py
          echo "── maq_latest_causal.json (말미) ──"
          tail -c 300 maq_latest_causal.json 2>/dev/null || echo "(생성 실패)"

      # ─── 🆕 REALHOLDINGS: 엔진 동결 원장 + 실제 브로커 보유 → 현 규칙 목표 ──
      #   알림·브리핑 공용 산출물. Brief HTML 직전에 두어 같은 run 에서 공유한다.
      #   🔴 원장은 읽기만 한다 — 체결로만 변경되며 워크플로가 재작성하지 않는다.
      - name: 🔁 전이 지시 산출 (transition_alert.json)
        run: |
          # 🔴 v9.1 교정: 원장은 PRIVATE(argus-briefing) 체크아웃이 정본이다.
          #   PUBLIC seed 로 덮으면 과거 사본이 정본을 밀어내는 역전이 생긴다.
          #   PUBLIC 은 열람용 미러일 뿐이므로 원장 seed 대상에서 제외한다.
          #   잠금 파일만 PUBLIC seed — GHA 는 매 run 새 컨테이너라 상태가 소실된다.
          if [ -f argus_position_ledger.json ]; then
            echo "원장: 체크아웃 정본 사용 ($(python3 -c "import json;print(json.load(open('argus_position_ledger.json'))['as_of'])"))"
          else
            echo "::error::엔진 동결 원장 부재 — 실계좌 전이 생성 불가"
          fi
          curl -sfL -H "User-Agent: ARGUS-GHA/1.0" \
            "https://raw.githubusercontent.com/daifulee/argus-public-data/main/argus_crown_ledger_lock.json" \
            -o argus_crown_ledger_lock.json && echo "seed 잠금 fetch ✅" || echo "seed 잠금 없음 (최초)"
          # 원장·실계좌 근거가 없어도 최신 목표를 계산하고 행동 준비는 닫는다.
          ENG="$ARGUS_ENGINE_FILE"
          echo "엔진: ${ENG}"
          LEDGER=argus_position_ledger.json
          if [ -f argus_position_ledger_causal.json ]; then
            LEDGER=argus_position_ledger_causal.json
          fi
          REAL_ARGS=()
          if [ -f argus_real_holdings.json ]; then
            REAL_ARGS=(--real-holdings argus_real_holdings.json)
          fi
          python argus_position_transition.py \
            --engine "${ENG}" \
            --ledger "$LEDGER" \
            "${REAL_ARGS[@]}" \
            --data argus_data_combined.csv \
            --lock argus_crown_ledger_lock.json \
            --alert-out transition_alert.json
          echo "── transition_alert.json ──"
          python3 - << 'PYEOF'
          import json
          d=json.load(open('transition_alert.json'))
          print('date', d.get('date'), '| crown', d.get('crown'),
                '| brokerage_actionable', d.get('actionable'),
                '| orders_computable', d.get('orders_computable'),
                '| real_orders', len(d.get('orders') or []),
                '| holdings_grounded', d.get('holdings_grounded'),
                '| action_block_reason', d.get('action_block_reason'))
          PYEOF

      - name: 🦅 Brief HTML 생성
        run: |
          python argus_brief_html_v2.py --input argus_data_combined.csv --engine "$ARGUS_ENGINE_FILE" --output briefing.html
          echo "✅ briefing.html $(wc -c < briefing.html) bytes"

      # ─── 🆕 DIR-S289_2 층 1: 원장 일일 기록 (당일 산출 동결) ───
      #   순서가 결정 사항이다 (P3). 전이 지시 산출(위)과 브리핑 렌더(위)는
      #   원장 상위 행 = "직전 영업일 산출"을 출발점으로 읽는다. 그 두 소비가
      #   끝난 뒤에야 당일 행을 상위로 승격해야 다음 영업일의 R3 이 성립한다.
      #   렌더보다 먼저 승격하면 전이 지시가 항상 0 이 되어 신호 전달이 소멸한다.
      #
      #   실측 배경: 원장은 recorded_at 2026-08-14 이후 쓰기 주체 없이 정지했고
      #   (as_of 2026-08-13 · 기록 결손 5영업일), 그 결과 전이 지시가 누적 차이가
      #   되어 산출 무변동일에도 같은 알림이 매일 재방출됐다.
      # 원장 기록 또는 커밋 실패 시 이후 배포를 중단한다.
      - name: 📒 원장 일일 기록 (DIR-S289_2 층 1)
        run: |
          ENG="$ARGUS_ENGINE_FILE"
          python argus_ledger_daily_record.py \
            --engine "${ENG}" \
            --ledger argus_position_ledger.json \
            --data argus_data_combined.csv \
            --alert transition_alert.json \
            --output argus_position_ledger_causal.json

      - name: 💾 원장 커밋 (argus-briefing, 변경 시에만)
        run: |
          if [[ -n "$(git status --porcelain argus_position_ledger_causal.json)" ]]; then
            git config user.name "argus-bot"
            git config user.email "argus-bot@users.noreply.github.com"
            git add argus_position_ledger_causal.json
            git commit -m "📒 ledger daily record $(python3 -c "import json;print(json.load(open('argus_position_ledger_causal.json'))['as_of'])")"
            git push origin ${{ github.ref_name }}
            echo "✅ 원장 커밋 완료"
          else
            echo "원장 변경 없음 — 커밋 생략 (동일 영업일 재실행)"
          fi

      - name: 🔀 redirect index.html 생성
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=briefing.html">
            <title>ARGUS → Briefing</title>
          </head>
          <body>
            <p><a href="briefing.html">🦅 ARGUS Briefing</a></p>
          </body>
          </html>
          EOF
          echo "✅ index.html redirect 생성"

      - name: 📤 Push to argus-public-data
        env:
          PAT: ${{ secrets.PUBLIC_REPO_PAT }}
          ORACLE_SHADOW_OUTCOME: ${{ steps.oracle_shadow.outcome }}
          DIVERGENCE_CAUSAL_OUTCOME: ${{ steps.divergence_causal.outcome }}
          SCOREBOARD_CAUSAL_OUTCOME: ${{ steps.scoreboard_causal.outcome }}
          MAQ_CAUSAL_OUTCOME: ${{ steps.maq_causal.outcome }}
        run: |
          python3 << 'PYEOF'
          import base64, json, os, urllib.request, urllib.error

          REPO = os.environ["REPO"]
          PAT  = os.environ["PAT"]
          API  = f"https://api.github.com/repos/{REPO}/contents"
          HDRS = {
              "Authorization": f"token {PAT}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "ARGUS-GHA/1.0",
          }

          def push_file(filepath, repo_path=None):
              """파일(filepath, 로컬)을 argus-public-data의 repo_path로 push (생성 또는 업데이트).
              🆕 v4: repo_path 기본 = filepath → 서브디렉토리(oracle/ 등) 보존 (basename 사용 금지)."""
              repo_path = repo_path or filepath
              with open(filepath, "rb") as f:
                  content_b64 = base64.b64encode(f.read()).decode()

              # 기존 파일 SHA 조회 (업데이트 시 필요)
              sha = None
              try:
                  req = urllib.request.Request(f"{API}/{repo_path}", headers=HDRS)
                  resp = urllib.request.urlopen(req)
                  data = json.loads(resp.read())
                  sha = data.get("sha")
              except urllib.error.HTTPError:
                  pass  # 파일 미존재 → 신규 생성

              # 요청 본문 구성
              body = {
                  "message": f"🦅 Brief update: {repo_path}",
                  "content": content_b64,
              }
              if sha:
                  body["sha"] = sha

              # PUT 요청
              payload = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{API}/{repo_path}",
                  data=payload,
                  headers={**HDRS, "Content-Type": "application/json"},
                  method="PUT",
              )
              # 🆕 v5: 409 blob sha 경합 재시도 (latest sha 재조회 → 재PUT, 최대 3회)
              for attempt in range(1, 4):
                  try:
                      resp = urllib.request.urlopen(req)
                      result = json.loads(resp.read())
                      new_sha = result["content"]["sha"][:12]
                      size_kb = os.path.getsize(filepath) / 1024
                      print(f"  ✅ {repo_path} → sha {new_sha} ({size_kb:.1f} KB)" + (f" [재시도 {attempt}]" if attempt > 1 else ""))
                      break
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode()
                      if e.code == 409 and attempt < 3:
                          print(f"  ⚠️ {repo_path} HTTP 409 (sha 경합) — latest sha 재조회 후 재시도 {attempt}/3")
                          try:
                              r2 = urllib.request.urlopen(urllib.request.Request(f"{API}/{repo_path}", headers=HDRS))
                              body["sha"] = json.loads(r2.read()).get("sha")
                          except urllib.error.HTTPError:
                              body.pop("sha", None)
                          payload = json.dumps(body).encode()
                          req = urllib.request.Request(f"{API}/{repo_path}", data=payload,
                              headers={**HDRS, "Content-Type": "application/json"}, method="PUT")
                          continue
                      print(f"  ❌ {repo_path} 실패: HTTP {e.code}")
                      print(f"     {err_body[:200]}")
                      raise SystemExit(1)

          print("📤 briefing.html 배포...")
          push_file("briefing.html")

          print("📤 index.html redirect 배포...")
          push_file("index.html")

          # 🆕 v3: PRIMA 일일 output 로그 + diff (로거 성공 시에만 — continue-on-error 대비)
          print("📤 PRIMA 일일 output 로그 배포...")
          for _f in ("prima_daily_output_causal.csv", "prima_daily_output_causal_diff.json"):
              if os.path.exists(_f):
                  push_file(_f)
              else:
                  print(f"  ⏭️  {_f} 없음 (로거 스텝 실패/스킵) — push 생략")

          # 과거 성과는 원본 복원본으로 별도 보관한다. 현재 성과 파일을 덮어쓰지 않는다.
          for archive_file in ("oracle/scoreboard_legacy_pre_causal.csv",
                               "oracle/scoreboard_legacy_pre_causal_provenance.json"):
              if os.path.exists(archive_file):
                  push_file(archive_file)

          # 이번 실행에 성공한 모니터 결과만 게시한다. 실패한 seed 파일은 게시하지 않는다.
          def publish_monitor_outputs(outcome_key, filenames):
              if os.environ.get(outcome_key) != "success":
                  print(f"  ⏭️ {outcome_key}: 이번 실행 실패/스킵 — 게시 생략")
                  return
              for filename in filenames:
                  if os.path.exists(filename):
                      push_file(filename)
                  else:
                      print(f"  ⏭️ {filename}: 이번 실행 산출물 없음 — 게시 생략")

          publish_monitor_outputs("ORACLE_SHADOW_OUTCOME", ("oracle/shadow_portfolio.json",))
          publish_monitor_outputs("DIVERGENCE_CAUSAL_OUTCOME", ("oracle/divergence_causal_snapshot.json",))
          publish_monitor_outputs("SCOREBOARD_CAUSAL_OUTCOME", (
              "oracle/scoreboard_causal.csv", "oracle/scoreboard_causal_status.json"))

          # 🆕 v9: 전이 지시 산출물 (알림 입력). 원장 자체는 push 금지 — 재작성 방지.
          print("📤 전이 지시 산출물 배포...")
          for _f in ("transition_alert.json", "argus_crown_ledger_lock.json"):
              if os.path.exists(_f):
                  push_file(_f)
              else:
                  print(f"  ⏭️  {_f} 없음 (전이 스텝 실패/스킵) — push 생략")

          publish_monitor_outputs("MAQ_CAUSAL_OUTCOME", (
              "maq_ledger_causal.csv", "maq_latest_causal.json", "maq_alert_state_causal.json"))

          print("✅ 전체 배포 완료")
          PYEOF

      # ─── 🆕 v8: 게시 검증 — raw 재회수 sha256 완전 대조 (자기참조 금지) ───
      #   "push API 200 == 열람 가능"이 아니다. 외부에서 다시 받아 빌드본과 대조해야
      #   커밋 유실·경쟁·CDN 이상이 그날 즉시 빨간불로 드러난다. 전파 재시도 5회(~2.5분).
      - name: 🔎 게시 검증 (raw 재회수 sha 대조)
        run: |
          want=$(sha256sum briefing.html | cut -d' ' -f1)
          sleep 20
          for i in 1 2 3 4 5; do
            curl -f -sS -H "User-Agent: ARGUS-GHA/1.0" \
              --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 60 \
              "https://raw.githubusercontent.com/daifulee/argus-public-data/main/briefing.html" \
              -o remote_briefing.html || true
            got=$(sha256sum remote_briefing.html 2>/dev/null | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then
              echo "✅ 게시 검증 PASS — raw == 빌드본 (sha ${want:0:12})"
              exit 0
            fi
            echo "…CDN 전파 대기 재시도 $i/5 (want ${want:0:12} / got ${got:0:12})"
            sleep 25
          done
          echo "::error::게시 검증 FAIL — raw 서빙본이 빌드본과 불일치. 열람 URL stale 위험."
          exit 1
