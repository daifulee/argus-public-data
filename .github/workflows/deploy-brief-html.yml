      # ─── 🆕 v5: MAQ (Missed-Alpha Queue) 관측 — 표시 전용, 자본 0 ───
      #   D-3 직후 배치. ledger/alert_state seed를 PUBLIC에서 fetch (누적 멱등·부재 시 신규).
      #   continue-on-error: 실패해도 브리핑·배포 무사 (분리 원칙).
      #   briefing v10.2.12 MAQ lane은 maq_latest.json 부재/stale 시 자동 생략 (무중단 계약).
      - name: 📡 MAQ monitor (queue + fwd 채점 + 초강후보 알림)
        id: maq_causal
        continue-on-error: true
        env:
          ARGUS_DATA: argus_data_combined.csv
