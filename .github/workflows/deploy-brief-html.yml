# 신규 수량 엔진 운영 연결판: 동일 입력·명시 엔진·새 기록 파일 사용
# 🦅 ARGUS Brief HTML 매일 자동 배포
# argus-briefing(PRIVATE) → argus-public-data(PUBLIC) Contents API push
# 🆕 v6 (S277): 밤 23:45 UTC (익일 08:45 KST) 실행 — data update 직후로 이동
# 🆕 briefing.html 분리 (루트 충돌 해소, index.html = redirect)
# 🆕 v2: curl -d @file 방식 (대용량 HTML ARG_MAX 회피)
# 🆕 v3 (S196, 2026-06-13): PRIMA 일일 output 로거 통합
#     - argus_data.csv fetch 직후 prima_daily_output_logger.py 실행 (continue-on-error)
#       → prima_daily_output_causal.csv (1행/일 append) + prima_daily_output_causal_diff.json 생성
#       · 엔진 output(포지션·비중·노출·당일 액션) 기록 + 전일 diff·사유(trade_log)
#       · 누적: 로거 seed가 argus-public-data에서 직전 CSV fetch→append (체크아웃 무관)
#       · LOCAL_DATA_CSV=./argus_data.csv → 동일-run CDN lag 회피
#     - push 블록에 prima_daily_output_causal.csv + prima_daily_output_causal_diff.json 추가
#     - 엔진 의존성 = pandas+numpy (기존 설치로 충분), 엔진 파일은 argus-briefing 체크아웃에 존재
#     - Commander 명령 S196: "매일 csv 기록 + 전날과 다른 output 시 사유 (브리핑) 기술"
#     - 격언 #41(전체 파일) / #107(UA) / #121 정합
# 🆕 v4 (S197, 2026-06-14): PANOPTES Phase 1 통합 — Oracle shadow / divergence / scoreboard
#     - 일일 로거 직후 3스텝: 🌑 D-1(shadow_portfolio.json) → ⚖️ D-2(divergence_log.csv) → 📊 D-3(scoreboard.csv)
#       · D-1 = oracle/data.json(Oracle 공식 발행 추천) 읽기 → Oracle 엔진 의존성 0
#       · D-2 = DIV-001 FSM + 현 분기 스냅샷, run_prima4 사용 (엔진 체크아웃 존재)
#       · D-3 = Oracle/PRIMA/SPY 누적수익 독립 NAV 재계산, 20사이클 KPI
#       · 3종 continue-on-error (브리핑·배포 분리), NAV capital_permission=false (자본 0)
#     - 🔧 push_file() 서브디렉토리 보존 수정 (basename → repo_path) → oracle/* 정확 경로 push
#     - push 블록에 oracle/shadow_portfolio.json · oracle/divergence_log.csv · oracle/scoreboard.csv 추가 (존재 시)
#     - 추가 의존성 0 (pandas+numpy 충분), 신규 스크립트 3종 = argus-briefing 루트 배치
#     - 격언 #41(전체 파일) / #107(UA) / #121 정합

# 🆕 v5 (S274, 2026-07-10): MAQ 통합 + 배포 견고화 2건
#     - 📡 MAQ 스텝 신설 (D-3 직후): maq_monitor.py 실행 (표시 전용 · capital_permission=False)
#       · seed: maq_ledger.csv / maq_alert_state.json을 argus-public-data에서 fetch (누적 멱등, 부재 시 신규)
#       · env ARGUS_DATA=./argus_data.csv (동일-run CDN lag 회피) + DISCORD_WEBHOOK_URL_MAQ secret (미등록=DRY)
#       · push 블록에 maq_ledger.csv / maq_latest.json / maq_alert_state.json 추가 (존재 시)
#     - 🔁 push_file 409 재시도: blob sha 경합(S273 07-09 oracle/scoreboard 실측) 시
#       latest sha 재조회 → 재PUT ≤3회 (근본 처방, DAILY_READ §14-8)
#     - 🚦 concurrency 그룹: 동시 다중 run 직렬화 (409 경합 원인 차단, cancel 없음)
#     - 격언 #41 / #107 / #121 / MAQ 자본 0 정합

# 🆕 v6 (S277, 2026-07-21): cron 순서 교정 — briefing 상시 지연 구조 근본 제거
#     - 🔧 cron '0 5 * * *' (아침 05 UTC = 14:00 KST) → '45 23 * * 1-5' (밤 23:45 UTC = 익일 08:45 KST)
#       · 진단(S277 실측): deploy run 은 매일 성공(#182까지 전부 초록)했으나, 아침 배치가
#         data update(밤 22:17/23:17 UTC, 미국 마감 후)보다 앞서 돌아 briefing 이 상시 1영업일+ 지연.
#         주말 겹침 시 금요일 데이터로 최대 3~4일 고정(07-18 토·07-19 일 → 07-20 아침 run 도 07-17 최신).
#         → "멈춤"이 아니라 순서 역전에 의한 staleness by design.
#       · 처방: data update retry(23:17 UTC, ~5분 소요) 완료 후 23:45 UTC 배치
#         → 당일 미국장 마감 데이터를 같은 밤에 즉시 반영, 데이터-briefing 지연 0.
#       · 요일 1-5: 미국 휴장(토·일)은 새 데이터 없음 → 주말 무의미 재빌드 제거
#         (금요일 briefing 유지 = 정상, 사각지대는 argus_stall_alert.yml 이 감시).
#       · GitHub cron 지연(1~3h)에도 data update 완료 후이므로 안전(retry 23:17 → deploy 23:45).
#     - 격언 #41(전체 파일) / #107(UA) / #121 정합

# 🔧 v9.1 (S288, 2026-08-14): 원장 seed 방향 교정 — PUBLIC seed 제거
#     - 첫 실행 실측: "seed argus_position_ledger.json 없음" 후 체크아웃 원장(as_of 08-10)
#       사용 → 정상 동작했으나, PUBLIC 에 과거 사본이 올라가는 순간 그것이 PRIVATE 정본을
#       덮어쓰는 역전이 발생한다. 원장은 체결로만 변경되는 자본 층 정본이므로
#       열람용 미러가 상위가 되어선 안 된다. → 원장 seed 제거, 잠금 파일만 seed.
#
# 🆕 v9 (S288, 2026-08-14): 🔁 전이 지시 레인 배선 — 알림 원천을 재현 diff 에서 전환
#     - 배경(Commander 지시): "알림은 리밸런싱·게이트 발동이 목적이다."
#       알림은 '무엇이 기록됐나'가 아니라 '오늘 무엇을 해야 하나'를 알려야 한다.
#     - 원천 3분류 중 ③만 목적에 부합:
#       ① 재현 diff(어제 재현본 vs 오늘 재현본) — run_prima4 final_weights 는 보유 상태
#          입력이 없어 "처음부터 이 규칙으로 굴렸다면"의 종착점. Crown 격상마다 과거
#          경로째 다시 그려져, 실계좌 무변동일에도 "청산 XLU·TLT" 가 발송됐다(08-11 실사고).
#       ② 원장 fills(이미 일어난 체결) — 사후 통지, 리밸·게이트 목적과 불일치.
#       ③ 전이 지시(원장 실보유 → 현 규칙 목표) — 오늘 할 일 ✅ + 게이트 발동 포함
#          (should_exit 를 실보유에 적용한 결과 = gate_exits).
#     - 🔁 전이 레인 스텝 신설 (MAQ 직후 · Brief HTML 직전):
#       argus_position_transition.py 실행 → transition_alert.json 산출.
#       Brief HTML 이 같은 레인을 직접 호출하므로 순서상 앞에 두어 산출물을 공유한다.
#     - seed: argus_position_ledger.json / argus_crown_ledger_lock.json 을 PUBLIC 에서 fetch
#       (원장은 체결로만 변경 — 워크플로가 쓰지 않고 읽기만 한다. Commander 영구명령 S288).
#     - push 블록에 transition_alert.json / argus_crown_ledger_lock.json 추가.
#       ⚠️ argus_position_ledger.json 은 push 하지 않는다 — 원장 재작성 금지 원칙.
#     - 전이 지시 산출은 fail-loud. 실보유/엔진 원장 부재 시 stale diff 폴백 금지.
#     - 격언 #15(자본 Commander) / #41 / #107 / #121 정합

# 🆕 v7 (S284, 2026-07-28): fail-loud 데이터 계약 + job timeout — 침묵 실패 구조 제거
#     - 진단(S284 실측): briefing.html 커밋 이력에 07-27 14:27 UTC ~ 07-28 00:23 UTC
#       10시간 공백. 예정 스케줄(23:45 UTC)이 그 한가운데 있으나 흔적 없음.
#       실행 이력 직접 확인 불가(비공개 저장소) → 커밋 부재로 역추론.
#     - 🔴 발견된 구조적 취약점 2건 (실행 이력과 무관하게 존재하던 결함):
#       (A) curl fetch에 -f(fail-on-http-error) 부재 → HTTP 4xx/5xx도 exit 0.
#           이후 손상/빈 CSV로 브리핑 생성 스텝이 예외 종료 → job 실패로
#           표시는 되나 원인이 로그 심층부에 묻혀 눈에 띄지 않음.
#       (B) job 레벨 timeout-minutes 부재 → 어떤 스텝이든 멈추면 GitHub
#           기본값 360분(6시간) 동안 concurrency 락 점유, 이후 스케줄
#           트리거가 그 뒤에서 대기만 하다 다음 예정 슬롯을 통째로 놓침.
#     - 처방 3건:
#       ① curl에 -f --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 60
#          부여 → 네트워크 계층 실패를 명시적 exit 코드로 승격.
#       ② 🆕 데이터 계약 검증 스텝 신설 (fetch 직후, continue-on-error 없음) —
#          행수 하한·헤더·말미 날짜 파싱을 fail-loud로 검사. 실패 시 Job Summary에
#          원인 명시 + exit 1. "왜 안 됐는지" 다음번엔 즉시 보이게.
#       ③ job에 timeout-minutes: 20 부여 → 최대 락 점유 360분→20분,
#          다음 스케줄 슬롯 보존.
#     - 격언 #41(전체 파일) / #107(UA) / #121 정합. REG-S284.

# 🆕 v8 (2026-08-03): 가격 무결성 가드 + 게시 검증 — 데이터 오염·게시 침묵 실패 원천 차단
#     - 🛡️ 가격 무결성 가드 스텝 신설 (데이터 계약 검증 직후, continue-on-error 없음):
#       argus_price_integrity_guard.py — R1 스파이크 경고(±15%) / R2 분할 패턴 FAIL
#       (±35%↑ ∩ 10×σ60 초과 ∩ 10거래일 내 반대쌍 곱≈1, 위기 변동성과 z-판별 구분) /
#       R3 교차 소스 FAIL(BT_LONG↔argus_data 겹침일 비율 ±5% 이탈).
#       실사고(2026-08-03): BT_LONG 말미 7행 블록 QQQM ×2.432 / SGOV ×0.918 오염
#       (조정 기준 불일치 append) → 4월 QQQM m1 −53% 허위 표시. 재발 시 배포 전 차단.
#       ⚠️ 전제: argus-public-data의 BT_LONG_v5_complete.csv 가 정정본(sha 120dff311037)
#       으로 교체되어 있어야 한다 — 미교체 상태면 본 가드가 현행 오염본을 적발해
#       의도적으로 FAIL한다(그것이 정상 동작).
#     - 🔎 게시 검증 스텝 신설 (push 직후): raw 재회수 → 빌드본과 sha256 완전 대조.
#       push_file 은 HTTP 오류에 fail-loud지만 "커밋됐다 ≠ 서빙된다"의 외부 확인이
#       없었다(S284 자기참조 금지 원칙의 게시 단계 확장). CDN 전파 재시도 5회.
#     - 격언 #41(전체 파일) / #107(UA) / #121 정합.

# 🆕 v11 (S290, 2026-09-11): SESSION FRESHNESS GATE — stale 신호 하류 차단
#     - 결함: 기존 데이터 계약은 행수/헤더/날짜 파싱만 검사하여, 2026-09-11 정오에도
#       2026-09-09 말미 CSV가 정상 통과하고 매매 신호가 생성될 수 있었다.
#     - 처방: exchange-calendars XNYS의 실제 session_close를 SSOT로 사용해
#       현재 UTC 시각 기준 '마지막 완결 미국 정규장'을 계산하고 CSV 말미와 정확히 일치시킨다.
#     - data_last < expected: stale → fail-loud. data_last > expected: 미완결/미래 row → fail-loud.
#     - 조기폐장·휴장·DST는 XNYS calendar가 처리한다. 엔진/자본 로직 무변경.

concurrency:
  group: deploy-brief-html
  cancel-in-progress: false

name: Deploy ARGUS Brief HTML

# 🆕 DIR-S289_2 층 1: 원장 일일 기록을 argus-briefing(현재 레포)에 커밋하기 위한 쓰기 권한.
#   rebalance_alert.yml 의 state 커밋 선례를 그대로 따른다.
permissions:
  contents: write

on:
  schedule:
    - cron: '45 23 * * 1-5'  # 🆕 v6: 밤 23:45 UTC = 익일 08:45 KST (data update 22:17/23:17 직후, 평일)
  workflow_dispatch:       # 수동 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 🆕 v7: 락 최대 점유 6h→20m (concurrency 슬롯 보존)
    env:
      REPO: daifulee/argus-public-data
      ARGUS_ENGINE: PRIMA2_v0_5_45_CROWN110_CAUSAL_GUARD.py
      ARGUS_ENGINE_FILE: PRIMA2_v0_5_45_CROWN110_CAUSAL_GUARD.py
      PRIMA_ENGINE_PATH: PRIMA2_v0_5_45_CROWN110_CAUSAL_GUARD.py
      ARGUS_COMBINED_DATA: argus_data_combined.csv
      LOCAL_DATA_CSV: argus_data_combined.csv
      ARGUS_DATA: argus_data_combined.csv
      ARGUS_DAILY_DIFF: prima_daily_output_causal_diff.json
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 의존성 설치
        run: pip install -r requirements-causal.txt

      - name: 🔎 교체 묶음 무결성 검사
        run: python verify_causal_installation.py

      - name: 🌐 최신 데이터 fetch
        run: |
          curl -f -sS -H "User-Agent: ARGUS-GHA/1.0" \
            --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/daifulee/argus-public-data/main/argus_data.csv" \
            -o argus_data.csv
          echo "✅ argus_data.csv $(( $(wc -l < argus_data.csv) - 1 ))행 (헤더 제외)"

      # ─── 🆕 v7: fail-loud 데이터 계약 검증 (S284) ─────────────────
      #   fetch 직후, continue-on-error 없음(의도적). 여기서 걸러야 브리핑
      #   생성 단계의 불명확한 예외 대신 원인이 명시된 실패로 즉시 드러난다.
      #   임계값(행수 하한 300)은 2026-07 기준 실측 ~403행 대비 보수적 여유.
      - name: 🛡️ 데이터 계약 검증 (fail-loud)
        run: |
          python3 - << 'EOF'
          import sys, datetime
          MIN_ROWS = 300
          try:
              with open("argus_data.csv", encoding="utf-8") as f:
                  lines = [l for l in f if l.strip()]
          except Exception as e:
              print(f"::error::argus_data.csv 읽기 실패: {e}")
              sys.exit(1)
          if len(lines) < 2:
              print("::error::argus_data.csv 사실상 비어있음 (헤더/데이터 부재)")
              sys.exit(1)
          header, last = lines[0], lines[-1]
          n_rows = len(lines) - 1
          if not header.startswith("Date"):
              print(f"::error::헤더 형식 이상 — 첫 20자: {header[:20]!r}")
              sys.exit(1)
          if n_rows < MIN_ROWS:
              print(f"::error::행수 이상 — {n_rows}행 (하한 {MIN_ROWS}) — "
                    f"CDN/네트워크 계층에서 절단된 응답 의심")
              sys.exit(1)
          last_date = last.split(",")[0].strip()
          try:
              datetime.datetime.strptime(last_date, "%Y-%m-%d")
          except Exception:
              print(f"::error::말미 행 날짜 파싱 실패 — {last_date!r}")
              sys.exit(1)
          print(f"✅ 데이터 계약 검증 통과 — {n_rows}행, 말미 {last_date}")
          EOF

      # ─── 🆕 v11: 마지막 완결 XNYS 세션 신선도 게이트 ───────────────
      #   단순 'N일 이내'가 아니라 실제 미국 정규장 session_close 기준으로 정확 일치해야 한다.
      #   stale 데이터 또는 미완결/미래 행으로 매매 신호가 만들어지는 것을 하류에서 차단한다.
      - name: ⏱️ 세션 신선도 검증 (XNYS completed-session SSOT)
        run: |
          python3 - << 'EOF'
          import os, sys
          import pandas as pd
          import exchange_calendars as xcals

          df = pd.read_csv("argus_data.csv", usecols=["Date"])
          if df.empty:
              print("::error::argus_data.csv 데이터 행 없음")
              sys.exit(1)

          dates = pd.to_datetime(df["Date"], errors="coerce")
          if dates.isna().any():
              print("::error::Date 열 파싱 실패 — 세션 신선도 판정 불가")
              sys.exit(1)
          data_last = dates.max().normalize()

          # 회귀 테스트 시에만 ARGUS_FRESHNESS_NOW_UTC를 주입할 수 있다.
          # GHA 실운영에서는 미설정 → 실제 UTC 현재시각 사용.
          now_raw = os.environ.get("ARGUS_FRESHNESS_NOW_UTC", "").strip()
          now = pd.Timestamp(now_raw) if now_raw else pd.Timestamp.now(tz="UTC")
          if now.tzinfo is None:
              now = now.tz_localize("UTC")
          else:
              now = now.tz_convert("UTC")

          cal = xcals.get_calendar("XNYS")
          sessions = cal.sessions_in_range(
              (now - pd.Timedelta(days=14)).date(),
              (now + pd.Timedelta(days=1)).date(),
          )
          completed = [s for s in sessions if cal.session_close(s) <= now]
          if not completed:
              print("::error::최근 완결 XNYS 세션을 찾지 못함")
              sys.exit(1)

          expected = pd.Timestamp(completed[-1]).normalize()
          expected_close = cal.session_close(completed[-1])

          print(f"  UTC now       : {now.isoformat()}")
          print(f"  XNYS expected : {expected.date()} (close {expected_close.isoformat()})")
          print(f"  CSV data_last : {data_last.date()}")

          if data_last < expected:
              between = cal.sessions_in_range(data_last.date(), expected.date())
              lag = max(len(between) - 1, 1)
              print(f"::error::DATA STALE — 마지막 완결 XNYS 세션보다 {lag}세션 뒤처짐: "
                    f"csv={data_last.date()} expected={expected.date()}")
              sys.exit(1)
          if data_last > expected:
              print(f"::error::DATA FUTURE/INCOMPLETE — 마지막 완결 세션보다 미래 행 존재: "
                    f"csv={data_last.date()} expected={expected.date()}")
              sys.exit(1)

          print(f"✅ SESSION FRESHNESS PASS — {data_last.date()} == 마지막 완결 XNYS 세션")
          EOF

      # ─── 🆕 v8: 가격 무결성 가드 (2026-08-03) ─────────────────────
      #   분할 미조정·조정 기준 불일치 아티팩트 검출 (QQQM·SGOV 실사고 재발 방지).
      #   continue-on-error 없음(의도적) — 오염 데이터로 만든 브리핑의 배포 자체를 차단.
      #   스크립트는 방금 fetch된 로컬 argus_data.csv 우선 사용, BT_LONG은 원격 회수.
      - name: 🛡️ 가격 무결성 가드 (분할·조정 아티팩트)
        run: |
          if [ -f argus_price_integrity_guard.py ]; then
            python argus_price_integrity_guard.py
          else
            echo "::error::기존 가격 무결성 검사 파일 부재"
            exit 1
          fi

      # ─── 🆕 REG-S289_4: 결합 데이터 단일 생성 (구간 불일치 차단) ───
      #   run_prima4 는 보유 상태 파라미터가 없어 주어진 데이터의 첫날부터
      #   전 경로를 재계산한다. 따라서 "어느 구간을 주느냐"가 종착 보유를 바꾼다.
      #   실측(2026-08-20 · Crown #110 동일 엔진):
      #     4,940행(2007~) → XLU 70.0 / GLD 23.95 / ITA 6.04
      #       420행(2025~) → GLD 70.0 / ITA 27.52 / SMH 1.63 / NLR 0.85
      #   브리핑은 결합본을, 전이 모듈은 argus_data 단독을 쓰고 있었다.
      #   결합 규약은 argus_brief_html_v2.fetch_live_data() 를 직접 호출한다
      #   (사본 금지 — 두 계통이 같은 함수를 쓴다).
      - name: 🔗 결합 데이터 생성 (브리핑과 동일 규약)
        run: |
          python argus_prepare_inputs.py --latest argus_data.csv --output argus_data_combined.csv
          python argus_causal_preflight.py --data argus_data_combined.csv --engine "$ARGUS_ENGINE_FILE" --allow-incomplete --json > argus_causal_preflight.json

      - name: 🔎 데이터·계좌 준비 사유 기록
        run: |
          python argus_holdings_contract.py --data argus_data_combined.csv --holdings argus_real_holdings.json --output argus_holdings_diagnostics.json
          python - <<'PYEOF'
          import json, os
          from pathlib import Path
          signal = json.loads(Path('argus_causal_preflight.json').read_text())
          account = json.loads(Path('argus_holdings_diagnostics.json').read_text())
          missing = signal.get('readiness', {}).get('missing_inputs', [])
          lines = ['### 데이터·계좌 준비 검사',
                   '- 필수 입력 미확인: ' + (', '.join(missing) or '없음'),
                   '- 실제 계좌 확인 사항: ' + (' / '.join(account['reasons']) or '없음'),
                   '- 신호 관측과 실제 자본 반영은 별도입니다.']
          if missing:
              lines.append('- 공개 데이터 저장소의 Data Update를 먼저 실행하고 완료 후 브리핑을 실행하세요.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PYEOF

      # ─── 🆕 v3: PRIMA 일일 output 로그 + diff ─────────────────────
      #   엔진 output(포지션·비중·노출·당일 액션)을 prima_daily_output_causal.csv 1행 append.
      #   전일 행과 비교 → 진입/청산/리밸 + 사유(trade_log) → prima_daily_output_causal_diff.json.
      #   누적: 로거 seed가 argus-public-data에서 직전 CSV fetch (체크아웃에 없어도 OK).
      #   continue-on-error: 로깅 실패해도 HTML 브리핑·배포 무사 (분리 원칙).
      #   엔진 파일은 argus-briefing 체크아웃 루트에 존재 → 로거 glob 자동 탐색.
      - name: 📊 PRIMA daily output log + diff
        continue-on-error: true
        env:
          LOCAL_DATA_CSV: argus_data_combined.csv     # 방금 fetch된 로컬 (동일-run CDN lag 회피)
          # PRIMA_ENGINE_PATH 미설정 → PRIMA_v*_LIVE.py / PRIMA2_*.py glob 자동
        run: |
          python argus_seed_causal_log.py
          python prima_daily_output_logger.py
          echo "── prima_daily_output_causal.csv (최근 3행) ──"
          tail -n 3 prima_daily_output_causal.csv 2>/dev/null || echo "(생성 실패)"

      # ─── 🆕 v4: PANOPTES Phase 1 — Oracle shadow + divergence + scoreboard ───
      #   일일 로거 직후 배치 (prima_daily_output_causal.csv = scoreboard PRIMA leg 의존).
      #   D-2/D-3는 D-1 산출(oracle/shadow_portfolio.json)을 소비 → D-1을 먼저.
      #   3종 continue-on-error: 실패해도 브리핑·배포 무사 (분리 원칙, NAV 자본 0).
      #   D-1은 oracle/data.json(Oracle 공식 발행) 읽기 → Oracle 엔진 의존성 불요.
      #   산출물(oracle/*)은 push 블록에서 argus-public-data로 전송 (PUBLIC_BASE seed 누적).
      - name: 🌑 Oracle shadow portfolio log (D-1)
        id: oracle_shadow
        continue-on-error: true
        run: |
          python oracle_shadow_logger.py
          echo "── oracle/shadow_portfolio.json (말미) ──"
          tail -c 400 oracle/shadow_portfolio.json 2>/dev/null || echo "(생성 실패)"

      - name: ⚖️ Divergence monitor (D-2)
        id: divergence_causal
        continue-on-error: true
        env:
          LOCAL_DATA_CSV: argus_data_combined.csv     # verdict 가격 = 동일-run CSV (CDN lag 회피)
          # 엔진은 상위 환경의 지정된 causal 파일만 사용한다.
        run: |
