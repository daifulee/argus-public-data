# ════════════════════════════════════════════════════════════════════
# 🦅 ARGUS Stall Alert — 데이터 정체·실패 감지 → Discord 알림 + 자동 재실행
# ════════════════════════════════════════════════════════════════════
# 목적(원인 불문 안전망): latest.json Date 가 과도하게 stale 하거나 Data Update 가
#   실패하면 당일 Discord 로 통보 + Data Update 자동 재실행. 6일 침묵 → 당일 통보 전환.
#
# 트리거 3종:
#   ① schedule 11:30 KST 평일 — primary(07:17)+retry(08:17) 이후 신선도 점검
#   ② workflow_run (Data Update 완료) — 실패(conclusion=failure) 감지
#   ③ workflow_dispatch — 수동 점검
#
# 판정: latest.json Date 와 오늘(KST) 사이 경과 영업일(Mon-Fri) 계산.
#   정상 = 데이터가 직전 거래일(≈영업일 1일 지연). 경과 영업일 ≥ STALE_MAX_BDAYS(2) → stale.
#
# 🔑 선행 1회: Settings > Secrets and variables > Actions > New repository secret
#     이름  DISCORD_WEBHOOK   값  Discord 채널 웹훅 URL (https://discord.com/api/webhooks/...)
#   ※ 미설정 시 알림 skip(경고만). 자동 재실행은 GITHUB_TOKEN 으로 동작.
# ════════════════════════════════════════════════════════════════════

name: 🚨 ARGUS Stall Alert

on:
  schedule:
    - cron: '30 2 * * 1-5'          # 02:30 UTC = 11:30 KST 평일 (primary+retry 이후)
  workflow_run:
    workflows: ["🦅 ARGUS Data Update"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write                     # 자동 재실행(gh workflow run) 용

concurrency:
  group: argus-stall-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      STALE_MAX_BDAYS: '2'
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      TRIGGER: ${{ github.event_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔎 신선도·실패 판정 + 알림 + 자동 재실행
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from datetime import date, datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          max_bdays = int(os.getenv("STALE_MAX_BDAYS", "2"))
          hook = os.getenv("DISCORD_WEBHOOK", "").strip()
          trigger = os.getenv("TRIGGER", "")
          run_conclusion = os.getenv("RUN_CONCLUSION", "")
          run_url = os.getenv("RUN_URL", "")

          # ── latest.json Date 읽기 ──
          data_date_str, gap_bdays, err = None, None, None
          try:
              with open("latest.json", encoding="utf-8") as f:
                  data_date_str = json.load(f)["Date"]
              y, m, d = map(int, data_date_str.split("-"))
              data_date = date(y, m, d)
              today = datetime.now(KST).date()
              gap_bdays = 0
              cur = data_date + timedelta(days=1)
              while cur <= today:
                  if cur.weekday() < 5:      # Mon(0)~Fri(4)
                      gap_bdays += 1
                  cur += timedelta(days=1)
          except Exception as e:
              err = f"latest.json 판독 실패: {e}"

          # ── 알림 사유 결정 ──
          reasons = []
          if trigger == "workflow_run" and run_conclusion == "failure":
              reasons.append("❌ Data Update 실행 **실패**")
          if err:
              reasons.append(f"🚨 {err}")
          elif gap_bdays is not None and gap_bdays >= max_bdays:
              reasons.append(f"🕳️ 데이터 **정체** — latest.json Date `{data_date_str}` · 경과 영업일 **{gap_bdays}일** (임계 {max_bdays})")

          if not reasons:
              print(f"✅ 정상 — latest.json Date={data_date_str}, 경과 영업일={gap_bdays} (임계 {max_bdays})")
              raise SystemExit(0)

          alert = " / ".join(reasons)
          print(f"🚨 ALERT: {alert}")

          # ── Discord 알림 ──
          if hook:
              content = ("🦅 **ARGUS Stall Alert**\n"
                         f"{alert}\n"
                         f"트리거: `{trigger}` · 레포: `argus-public-data`\n"
                         f"Actions: {run_url}\n"
                         "→ Data Update 자동 재실행 시도함.")
              body = json.dumps({"content": content}).encode("utf-8")
              req = urllib.request.Request(hook, data=body,
                                           headers={"Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=20)
                  print("✅ Discord 알림 전송")
              except Exception as e:
                  print(f"⚠️ Discord 전송 실패: {e}")
          else:
              print("⚠️ DISCORD_WEBHOOK 미설정 — 알림 skip")

          # ── 자동 재실행 (정체/실패 시 Data Update 재트리거) ──
          try:
              subprocess.run(
                  ["gh", "workflow", "run", "🦅 ARGUS Data Update"],
                  check=True)
              print("🔁 Data Update 자동 재실행 트리거 완료")
          except Exception as e:
              print(f"⚠️ 자동 재실행 실패: {e}")
          PY
