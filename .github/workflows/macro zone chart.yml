name: ARGUS Macro Zone Chart

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy

      - name: Generate overlay.json + index.html
        run: |
          python3 gen_macro_zone_chart.py
          echo "=== site/ 내용 ==="
          ls -la site/
          echo "=== overlay.json 앞부분 ==="
          head -c 200 site/overlay.json || echo "overlay.json 없음"

      - name: Verify site contents
        run: |
          if [ ! -f site/index.html ]; then
            echo "ERROR: site/index.html 없음"
            exit 1
          fi
          if [ ! -f site/overlay.json ]; then
            echo "ERROR: site/overlay.json 없음"
            exit 1
          fi
          echo "site/index.html: $(wc -c < site/index.html) bytes"
          echo "site/overlay.json: $(wc -c < site/overlay.json) bytes"

      - name: Enable Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
