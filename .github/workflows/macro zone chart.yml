name: ARGUS Macro Zone Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'  # 월~금 UTC 21:30 (KST 06:30)

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Generate zone chart
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python gen_macro_zone_chart.py

      - name: Commit overlay + chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argusmap.html argusmap_overlay.json zone_data_v4.json
          git diff --staged --quiet || git commit -m "🔧 zone chart: $(date -u +%Y-%m-%d) overlay 갱신"
          git push
